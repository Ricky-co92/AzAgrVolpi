<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azienda Agricola Volpi — Registro di Campagna</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Fraunces:ital,wght@0,600;0,700;1,500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="rail-brand"><h1>Azienda Agricola Volpi</h1></div>
    <div class="nav-item active" data-view="dashboard">Home</div>
    <div class="nav-item" data-view="scadenze">Scadenze</div>
    <div class="nav-item" data-view="campi">Campi</div>
    <div class="nav-item" data-view="mezzi">Mezzi</div>
    <div class="nav-item" data-view="attrezzature">Attrezzature</div>
    <div class="nav-item" data-view="impostazioni">Impostazioni</div>
    <div class="rail-foot">Registro di Campagna<br><span id="logoutLink" style="cursor:pointer; text-decoration:underline;">Esci</span></div>
  </nav>
  <div class="rail-backdrop" id="railBackdrop"></div>

  <div class="main">
    <div class="watermark" aria-hidden="true"><img src="logo-bg.jpg" alt=""></div>
    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="menu-toggle" id="menuToggle" aria-label="Apri menu">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
        </button>
        <h2 id="viewTitle">Home</h2>
      </div>
      <div class="date" id="topDate"></div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div id="splash" class="splash">
  <img class="splash-logo" src="logo.png" alt="Azienda Agricola Volpi">
  <div class="splash-title">Azienda Agricola Volpi</div>
</div>

<div id="loginScreen" class="login-screen hidden">
  <svg class="login-hills" viewBox="0 0 1000 300" preserveAspectRatio="none">
    <path d="M0,180 C200,100 350,220 550,140 C700,90 850,180 1000,120 L1000,300 L0,300 Z" fill="#9FB582"/>
    <path d="M0,220 C220,160 400,250 620,190 C780,150 900,230 1000,190 L1000,300 L0,300 Z" fill="#5C7A48"/>
    <path d="M0,260 C250,230 500,280 750,240 C860,222 950,255 1000,240 L1000,300 L0,300 Z" fill="#2E3F29"/>
  </svg>
  <div class="login-glow"></div>
  <div class="login-box">
    <img class="login-logo" src="logo.png" alt="Azienda Agricola Volpi">
    <h2 style="margin:8px 0 3px;">Azienda Agricola Volpi</h2>
    <div style="color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;font-weight:600;">Accedi per continuare</div>
    <form id="loginForm" class="modal-form">
      <div><label>Email</label><input type="email" name="email" required></div>
      <div><label>Password</label><input type="password" name="password" required></div>
      <div id="loginError" style="color:var(--rust);font-size:12px; display:none;"></div>
      <button class="btn primary" type="submit" style="margin-top:4px;">Accedi</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
